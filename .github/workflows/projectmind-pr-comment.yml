name: ProjectMind PR comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        id: proof
        continue-on-error: true
        with:
          name: projectmind-self-proof
          path: .projectmind/comment-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Render validated comment from the trusted default branch
        if: steps.proof.outcome == 'success'
        run: node --experimental-strip-types apps/cli/src/index.ts report pr-comment .projectmind/comment-input/latest-proof.json --output .projectmind/pr-comment.md
      - name: Report missing ProofPack without trusting PR content
        if: steps.proof.outcome != 'success'
        run: |
          mkdir -p .projectmind
          printf '%s\n' \
            '<!-- projectmind-verification -->' \
            '## ⚠️ ProjectMind: NOT VERIFIED' \
            '' \
            'The verification workflow did not produce a valid ProofPack artifact. Inspect the failed CI jobs before merging.' \
            '' \
            '> No verification verdict was reconstructed from logs or claims.' \
            > .projectmind/pr-comment.md
      - uses: actions/github-script@v7
        env:
          PROJECTMIND_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- projectmind-verification -->';
            const body = fs.readFileSync('.projectmind/pr-comment.md', 'utf8');
            const issue_number = Number(process.env.PROJECTMIND_PR);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }
